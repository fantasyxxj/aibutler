<path d="M795.1,439.1 A200,150 0 0 1 741.4,414.9" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ag)"/>
<path d="M679.8,346.4 A200,150 0 0 1 679.8,253.6" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ag)"/>
<path d="M746.9,181.8 A200,150 0 0 1 801.6,159.0" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="780.0" y="127.0" width="180" height="46" rx="23" fill="#161f3d" stroke="#4ade80" stroke-opacity="0.6"/><text x="870.0" y="155.0" text-anchor="middle" font-size="14" fill="#e6ebff">You mention a need</text>
<rect x="953.2" y="202.0" width="180" height="46" rx="23" fill="#173a2c" stroke="#4ade80" stroke-opacity="1"/><text x="1043.2" y="230.0" text-anchor="middle" font-size="14" fill="#e6ebff">Agent writes a plugin</text>
<rect x="953.2" y="352.0" width="180" height="46" rx="23" fill="#161f3d" stroke="#4ade80" stroke-opacity="0.6"/><text x="1043.2" y="380.0" text-anchor="middle" font-size="14" fill="#e6ebff">Hot-installs instantly</text>
<rect x="780.0" y="427.0" width="180" height="46" rx="23" fill="#161f3d" stroke="#4ade80" stroke-opacity="0.6"/><text x="870.0" y="455.0" text-anchor="middle" font-size="14" fill="#e6ebff">You use it in chat</text>
<rect x="606.8" y="352.0" width="180" height="46" rx="23" fill="#161f3d" stroke="#4ade80" stroke-opacity="0.6"/><text x="696.8" y="380.0" text-anchor="middle" font-size="14" fill="#e6ebff">You flag weak spots</text>
