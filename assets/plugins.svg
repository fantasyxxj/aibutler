<text x="870" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#e6ebff">Tools that grow</text>
<text x="870" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#e6ebff">around you</text>
