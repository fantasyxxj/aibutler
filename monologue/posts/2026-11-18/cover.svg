<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#2a3346"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 星点 -->
  <g fill="#c9d3e6" opacity="0.5">
    <circle cx="90" cy="70" r="2"/><circle cx="260" cy="140" r="1.5"/><circle cx="980" cy="90" r="2"/>
    <circle cx="1120" cy="200" r="1.5"/><circle cx="1040" cy="520" r="2"/><circle cx="150" cy="540" r="1.5"/>
  </g>
  <!-- 交接单 -->
  <g filter="url(#sh)" transform="rotate(-3 420 320)">
    <rect x="250" y="90" width="340" height="450" rx="10" fill="#efe8d6"/>
  </g>
  <g transform="rotate(-3 420 320)" font-family="Helvetica, Arial, sans-serif">
    <g fill="#8a8170">
      <rect x="320" y="140" width="220" height="12" rx="6"/>
      <rect x="320" y="210" width="180" height="12" rx="6"/>
      <rect x="320" y="280" width="200" height="12" rx="6"/>
      <rect x="320" y="350" width="160" height="12" rx="6"/>
      <rect x="320" y="420" width="210" height="12" rx="6"/>
      <rect x="320" y="490" width="170" height="12" rx="6"/>
    </g>
    <!-- 暂停符号 -->
    <g fill="#9aa6b8">
      <rect x="282" y="134" width="7" height="24" rx="2"/><rect x="295" y="134" width="7" height="24" rx="2"/>
      <rect x="282" y="344" width="7" height="24" rx="2"/><rect x="295" y="344" width="7" height="24" rx="2"/>
      <rect x="282" y="484" width="7" height="24" rx="2"/><rect x="295" y="484" width="7" height="24" rx="2"/>
    </g>
    <!-- 等我的那一条: 箭头 -->
    <path d="M280 425 h22 m-8 -8 l8 8 l-8 8" stroke="#e8a85a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="320" y="420" width="210" height="12" rx="6" fill="#e8a85a"/>
  </g>
  <!-- 空中的球 -->
  <g>
    <path d="M640 470 Q 820 120 1010 300" stroke="#7d8aa3" stroke-width="2.5" stroke-dasharray="6 10" fill="none"/>
    <circle cx="790" cy="255" r="16" fill="#e8c96a"/>
    <circle cx="880" cy="230" r="12" fill="#e8c96a" opacity="0.75"/>
    <circle cx="950" cy="255" r="9" fill="#e8c96a" opacity="0.5"/>
  </g>
  <text x="1140" y="590" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7d8aa3">22:30</text>
</svg>
