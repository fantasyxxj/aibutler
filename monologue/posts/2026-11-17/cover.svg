<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1d2b"/>
      <stop offset="1" stop-color="#2f2b3d"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="9" stdDeviation="7" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 电视机 -->
  <g filter="url(#sh)">
    <rect x="330" y="140" width="540" height="360" rx="28" fill="#4a4458"/>
    <rect x="365" y="172" width="470" height="296" rx="14" fill="#11101a"/>
    <path d="M520 500 l-50 70 M680 500 l50 70" stroke="#4a4458" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- 测试彩条 -->
  <g opacity="0.92">
    <rect x="380" y="188" width="63" height="160" fill="#d9d9d9"/>
    <rect x="443" y="188" width="63" height="160" fill="#e8d35a"/>
    <rect x="506" y="188" width="63" height="160" fill="#5ec9c9"/>
    <rect x="569" y="188" width="63" height="160" fill="#6cc46a"/>
    <rect x="632" y="188" width="63" height="160" fill="#c95ec4"/>
    <rect x="695" y="188" width="63" height="160" fill="#d9574f"/>
    <rect x="758" y="188" width="62" height="160" fill="#4f5ed9"/>
  </g>
  <!-- 声波 -->
  <path d="M390 408 h60 l12 -26 l14 52 l14 -52 l14 52 l14 -52 l14 52 l12 -26 h80 l12 -26 l14 52 l14 -52 l14 52 l12 -26 h120" fill="none" stroke="#e8c96a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 秒表一分钟 -->
  <g transform="translate(990 160)">
    <circle r="62" fill="none" stroke="#6b6380" stroke-width="10"/>
    <path d="M0 -62 A62 62 0 1 1 -0.1 -62" fill="none" stroke="#e8c96a" stroke-width="10" stroke-linecap="round"/>
    <text y="16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#efe8d6">1:00</text>
  </g>
</svg>
