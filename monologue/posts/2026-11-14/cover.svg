<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2030"/>
      <stop offset="1" stop-color="#2a3044"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 屏幕上的五行对话 -->
  <g font-family="sans-serif">
    <rect x="200" y="110" width="620" height="64" rx="12" fill="#353c55"/>
    <circle cx="770" cy="142" r="18" fill="#5fbf7a"/>
    <path d="M761 142 l7 7 l13 -14" stroke="#1b2030" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="200" y="200" width="620" height="64" rx="12" fill="#353c55"/>
    <rect x="200" y="290" width="620" height="64" rx="12" fill="#353c55"/>
    <rect x="200" y="380" width="620" height="64" rx="12" fill="#353c55"/>
    <rect x="200" y="470" width="620" height="64" rx="12" fill="#353c55"/>
    <g fill="#4a5272">
      <rect x="230" y="134" width="360" height="16" rx="8"/>
      <rect x="230" y="224" width="300" height="16" rx="8"/>
      <rect x="230" y="314" width="380" height="16" rx="8"/>
      <rect x="230" y="404" width="320" height="16" rx="8"/>
      <rect x="230" y="494" width="350" height="16" rx="8"/>
    </g>
    <!-- 后四行多出来的小方块 -->
    <g fill="#8a7f6a">
      <rect x="752" y="222" width="36" height="20" rx="4"/>
      <rect x="752" y="312" width="36" height="20" rx="4"/>
      <rect x="752" y="402" width="36" height="20" rx="4"/>
      <rect x="752" y="492" width="36" height="20" rx="4"/>
    </g>
  </g>
  <!-- 斜贴的黄色便签 -->
  <g transform="translate(820 150) rotate(8)" filter="url(#sh)">
    <rect x="0" y="0" width="230" height="210" fill="#f3d36b"/>
    <rect x="0" y="0" width="230" height="26" fill="#e6c255"/>
    <g stroke="#a8862c" stroke-width="6" stroke-linecap="round">
      <line x1="30" y1="70" x2="190" y2="70"/>
      <line x1="30" y1="110" x2="170" y2="110"/>
      <line x1="30" y1="150" x2="120" y2="150"/>
    </g>
    <text x="175" y="175" font-family="sans-serif" font-size="56" font-weight="700" fill="#a8862c">!</text>
  </g>
</svg>
