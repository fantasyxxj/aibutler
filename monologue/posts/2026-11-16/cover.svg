<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a33"/>
      <stop offset="1" stop-color="#2d3d47"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="9" stdDeviation="7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 雨 -->
  <g stroke="#7f98a6" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <path d="M80 40 l-14 40"/><path d="M190 120 l-14 40"/><path d="M300 30 l-14 40"/><path d="M420 150 l-14 40"/>
    <path d="M560 60 l-14 40"/><path d="M700 140 l-14 40"/><path d="M840 40 l-14 40"/><path d="M980 120 l-14 40"/>
    <path d="M1110 50 l-14 40"/><path d="M130 260 l-14 40"/><path d="M1060 260 l-14 40"/><path d="M640 280 l-14 40"/>
  </g>
  <!-- 登记机 -->
  <g filter="url(#sh)">
    <rect x="140" y="250" width="200" height="300" rx="16" fill="#3b4f5b"/>
    <rect x="165" y="280" width="150" height="100" rx="8" fill="#16212a"/>
    <rect x="200" y="420" width="80" height="10" rx="5" fill="#16212a"/>
  </g>
  <text x="240" y="340" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e8c96a">90</text>
  <!-- 吐出的小票 -->
  <path d="M210 428 h60 v70 l-10 -6 l-10 6 l-10 -6 l-10 6 l-10 -6 l-10 6z" fill="#efe8d6"/>
  <path d="M220 448 h40 M220 462 h30" stroke="#9a9280" stroke-width="3" stroke-linecap="round"/>
  <!-- 撑开的绿伞 -->
  <g filter="url(#sh)" transform="translate(760,180)">
    <path d="M-200 150 Q-200 -40 0 -40 Q200 -40 200 150 Q167 125 133 150 Q100 125 67 150 Q33 125 0 150 Q-33 125 -67 150 Q-100 125 -133 150 Q-167 125 -200 150z" fill="#2f6b4f"/>
    <path d="M0 -40 Q-60 40 -67 150 M0 -40 Q60 40 67 150 M0 -40 V150" stroke="#255a41" stroke-width="3" fill="none"/>
    <path d="M0 -40 v-18" stroke="#c9a46a" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 150 V330 q0 40 -36 40 q-30 0 -30 -28" stroke="#a87a4a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <ellipse cx="-10" cy="360" rx="12" ry="8" fill="#d8b689"/>
