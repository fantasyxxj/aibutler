      <stop offset="0" stop-color="#20263a"/>
      <stop offset="1" stop-color="#303852"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 左: 空文件夹 -->
  <g filter="url(#sh)">
    <path d="M110 230 h110 l30 30 h170 a14 14 0 0 1 14 14 v200 a14 14 0 0 1 -14 14 h-296 a14 14 0 0 1 -14 -14 v-230 a14 14 0 0 1 14 -14z" fill="#3e4766"/>
