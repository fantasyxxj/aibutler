<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
  </defs>
  <rect width="900" height="560" fill="#FAFAF7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图1  多源标识归一成统一用户：确定性边、连通分量与合并护栏</text>

  <!-- 图例 -->
  <g font-size="12" fill="#4B5563">
    <rect x="40" y="56" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#9CA3AF"/><text x="60" y="68">匿名标识</text>
    <rect x="130" y="56" width="14" height="14" rx="3" fill="#F3F7FE" stroke="#9DBBEB"/><text x="150" y="68">设备标识</text>
    <rect x="220" y="56" width="14" height="14" rx="3" fill="#ECF7EF" stroke="#7CC08F"/><text x="240" y="68">账号</text>
    <rect x="290" y="56" width="14" height="14" rx="3" fill="#FEF6EC" stroke="#E8B97A"/><text x="310" y="68">第三方登录标识</text>
    <line x1="420" y1="63" x2="450" y2="63" stroke="#374151" stroke-width="1.8"/><text x="456" y="68">同一事件同时出现（确定性边）</text>
    <line x1="640" y1="63" x2="670" y2="63" stroke="#B42318" stroke-width="1.8" stroke-dasharray="5 4"/><text x="676" y="68">被护栏拦下的边</text>
  </g>

  <!-- 分量 1 -->
  <rect x="30" y="90" width="390" height="270" rx="14" fill="#F7F9FC" stroke="#9DBBEB" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="225" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#1F4E9E">连通分量 1 → 统一用户 P1</text>
  <g stroke="#374151" stroke-width="1.8">
    <line x1="110" y1="160" x2="225" y2="215"/>
    <line x1="110" y1="270" x2="225" y2="215"/>
    <line x1="225" y1="215" x2="340" y2="160"/>
    <line x1="225" y1="215" x2="340" y2="270"/>
    <line x1="345" y1="290" x2="345" y2="302"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="55" y="140" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/><text x="110" y="165" fill="#1F2937">匿名 a1（网页）</text>
    <rect x="55" y="250" width="110" height="40" rx="8" fill="#F3F7FE" stroke="#9DBBEB"/><text x="110" y="275" fill="#1F4E9E">设备 d1（手机）</text>
    <rect x="170" y="195" width="110" height="40" rx="8" fill="#ECF7EF" stroke="#7CC08F" stroke-width="1.6"/><text x="225" y="220" font-weight="600" fill="#1F7A3D">账号 u1</text>
    <rect x="285" y="140" width="120" height="40" rx="8" fill="#FEF6EC" stroke="#E8B97A"/><text x="345" y="165" fill="#9A5B13">第三方 t1</text>
    <rect x="285" y="250" width="120" height="40" rx="8" fill="#F3F7FE" stroke="#9DBBEB"/><text x="345" y="275" fill="#1F4E9E">设备 d2（平板）</text>
    <rect x="295" y="302" width="100" height="36" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/><text x="345" y="325" fill="#1F2937">匿名 a2</text>
  </g>

  <!-- 分量 2 -->
  <rect x="480" y="90" width="390" height="270" rx="14" fill="#F7F9FC" stroke="#9DBBEB" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="675" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#1F4E9E">连通分量 2 → 统一用户 P2</text>
  <g stroke="#374151" stroke-width="1.8">
    <line x1="560" y1="160" x2="675" y2="215"/>
    <line x1="675" y1="215" x2="790" y2="160"/>
    <line x1="675" y1="215" x2="790" y2="270"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="505" y="140" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/><text x="560" y="165" fill="#1F2937">匿名 a3</text>
    <rect x="620" y="195" width="110" height="40" rx="8" fill="#ECF7EF" stroke="#7CC08F" stroke-width="1.6"/><text x="675" y="220" font-weight="600" fill="#1F7A3D">账号 u2</text>
    <rect x="735" y="140" width="120" height="40" rx="8" fill="#FEF6EC" stroke="#E8B97A"/><text x="795" y="165" fill="#9A5B13">第三方 t2</text>
    <rect x="735" y="250" width="120" height="40" rx="8" fill="#F3F7FE" stroke="#9DBBEB"/><text x="795" y="275" fill="#1F4E9E">设备 d3</text>
  </g>

  <!-- 错边 -->
  <rect x="380" y="380" width="140" height="42" rx="8" fill="#FDECEC" stroke="#B42318" stroke-width="1.6"/>
  <text x="450" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#B42318">设备 000…0</text>
  <text x="450" y="414" text-anchor="middle" font-size="11" fill="#B42318">取不到时的默认值</text>
  <g stroke="#B42318" stroke-width="1.8" stroke-dasharray="5 4" fill="none">
    <path d="M395,382 C260,372 190,310 205,237"/>
    <path d="M500,380 L660,237"/>
  </g>
  <text x="450" y="446" text-anchor="middle" font-size="12" fill="#B42318">若不拦：传递性把 P1 与 P2 连成一个人</text>

  <!-- 护栏 -->
  <rect x="30" y="462" width="840" height="78" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="450" y="486" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">合并护栏：越界的边进待决，不进图</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="135" y="510">① 无效值名单</text><text x="135" y="527" fill="#6B7280">全零、空串、占位符</text>
    <text x="345" y="510">② 每类标识数量上限</text><text x="345" y="527" fill="#6B7280">一台设备最多连几个账号</text>
    <text x="555" y="510">③ 优先级</text><text x="555" y="527" fill="#6B7280">账号 &gt; 设备 &gt; 匿名标识</text>
    <text x="765" y="510">④ 簇大小告警</text><text x="765" y="527" fill="#6B7280">长尾簇送 AI 解释、人裁决</text>
  </g>
</svg>
