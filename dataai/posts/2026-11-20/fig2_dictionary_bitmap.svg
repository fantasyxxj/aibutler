<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker>
  </defs>
  <rect width="900" height="580" fill="#FAFAF7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图2  字典化取号、位图去重与编码版本切换</text>

  <!-- 上：取号 → 位图 → 合并 -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="64" width="190" height="112" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="125" y="88" font-weight="600" fill="#1F2937">标识（字符串）</text>
    <text x="125" y="112" fill="#4B5563">u-7f3a…</text>
    <text x="125" y="132" fill="#4B5563">u-91c0…</text>
    <text x="125" y="152" fill="#4B5563">u-02be…（新）</text>

    <rect x="260" y="64" width="190" height="112" rx="10" fill="#F3F7FE" stroke="#9DBBEB" stroke-width="1.5"/>
    <text x="355" y="88" font-weight="600" fill="#1F4E9E">全局字典 v1</text>
    <text x="355" y="112" fill="#374151">u-7f3a… → 1</text>
    <text x="355" y="132" fill="#374151">u-91c0… → 2</text>
    <text x="355" y="152" fill="#374151">u-02be… → 3（追加）</text>

    <rect x="490" y="64" width="170" height="112" rx="10" fill="#ECF7EF" stroke="#7CC08F"/>
    <text x="575" y="88" font-weight="600" fill="#1F7A3D">每小时位图</text>
    <text x="575" y="112" fill="#374151">10 时 {1, 2}</text>
    <text x="575" y="132" fill="#374151">11 时 {2, 3}</text>
    <text x="575" y="152" fill="#6B7280" font-size="12">带：字典 v1 · 编码对象</text>

    <rect x="700" y="64" width="170" height="112" rx="10" fill="#ECF7EF" stroke="#7CC08F"/>
    <text x="785" y="88" font-weight="600" fill="#1F7A3D">天去重 = 并集</text>
    <text x="785" y="112" fill="#374151">{1, 2, 3}</text>
    <text x="785" y="132" fill="#374151">计数 3（精确）</text>
    <text x="785" y="152" fill="#6B7280" font-size="12">同版本内可合并</text>
  </g>
  <g stroke="#6B7280" stroke-width="1.6">
    <line x1="220" y1="120" x2="258" y2="120" marker-end="url(#g)"/>
    <line x1="450" y1="120" x2="488" y2="120" marker-end="url(#g)"/>
    <line x1="660" y1="120" x2="698" y2="120" marker-end="url(#g)"/>
  </g>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#4B5563">取号规则：同值同号 · 只追加、单调取号（号越连续，位图越密）· 串行分配，防并发重复取号</text>

  <!-- 时间线 -->
  <line x1="60" y1="270" x2="850" y2="270" stroke="#6B7280" stroke-width="2" marker-end="url(#g)"/>
  <text x="858" y="275" font-size="12" fill="#6B7280">时间</text>
  <rect x="60" y="250" width="400" height="40" rx="6" fill="#F3F7FE" stroke="#9DBBEB"/>
  <text x="260" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#1F4E9E">字典 v1：编码对象 = 设备</text>
  <rect x="470" y="250" width="370" height="40" rx="6" fill="#FEF6EC" stroke="#E8B97A"/>
  <text x="655" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#9A5B13">字典 v2：编码对象 = 统一用户（重新取号）</text>
  <line x1="465" y1="236" x2="465" y2="306" stroke="#B42318" stroke-width="2"/>
  <text x="465" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#B42318">归一规则升级 / 字典重建</text>

  <!-- 同号不同人 -->
  <g font-size="13" text-anchor="middle">
    <rect x="150" y="320" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="260" y="343" fill="#1F2937">v1 位图里的号 2</text>
    <text x="260" y="363" fill="#6B7280" font-size="12">＝ 设备 d-91c0…</text>
    <rect x="545" y="320" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="655" y="343" fill="#1F2937">v2 位图里的号 2</text>
    <text x="655" y="363" fill="#6B7280" font-size="12">＝ 统一用户 P-0007</text>
  </g>
  <line x1="372" y1="348" x2="543" y2="348" stroke="#B42318" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="457" y="340" text-anchor="middle" font-size="12" fill="#B42318">同号不同人</text>

  <rect x="150" y="396" width="615" height="44" rx="8" fill="#FDECEC" stroke="#B42318" stroke-width="1.6"/>
  <text x="457" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#B42318">v1 位图 ∪ / ∩ v2 位图：结果无意义，且不会报错</text>
  <text x="457" y="432" text-anchor="middle" font-size="12" fill="#374151">取数时按位图所带的字典版本拦下跨版本合并</text>

  <!-- 两条出路 -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="466" width="380" height="94" rx="10" fill="#ECF7EF" stroke="#7CC08F"/>
    <text x="250" y="490" font-weight="600" fill="#1F7A3D">出路一：按新字典重算历史</text>
    <text x="250" y="512" fill="#374151" font-size="12">并行产出新表 → 与旧表比对差异</text>
    <text x="250" y="530" fill="#374151" font-size="12">→ 追平后下游切换 → 下线旧表</text>
    <text x="250" y="548" fill="#6B7280" font-size="12">代价：重算影响面内的全部中间态</text>
    <rect x="460" y="466" width="380" height="94" rx="10" fill="#F3F7FE" stroke="#9DBBEB"/>
    <text x="650" y="490" font-weight="600" fill="#1F4E9E">出路二：保留新旧号对照表</text>
    <text x="650" y="512" fill="#374151" font-size="12">把旧位图逐个翻译到 v2 编码</text>
    <text x="650" y="530" fill="#374151" font-size="12">再与 v2 位图合并</text>
    <text x="650" y="548" fill="#6B7280" font-size="12">前提：每个旧号都能映射到新的编码对象</text>
  </g>
</svg>
