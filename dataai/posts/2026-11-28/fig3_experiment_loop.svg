<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
  <rect width="900" height="560" fill="#FAFAF7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图3  实验知识的闭环：检查、监测、裁决、沉淀、召回</text>
  <g font-size="13.5" fill="#1F2937">
    <g transform="translate(40,80)"><rect width="250" height="130" rx="10" fill="#FCF3E3" stroke="#C98A1B" stroke-width="1.6"/><text x="125" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#6B4A0E">设计前 · AI 检查</text><text x="16" y="56">召回指标口径，比去重对象</text><text x="16" y="80">召回归一规则，估跨端比例</text><text x="16" y="104">召回历史方差，估最小效应</text></g>
    <g transform="translate(325,80)"><rect width="250" height="130" rx="10" fill="#FCF3E3" stroke="#C98A1B" stroke-width="1.6"/><text x="125" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#6B4A0E">运行中 · AI 监测</text><text x="16" y="56">每日总体与分段 SRM</text><text x="16" y="80">数据齐否、流量重叠</text><text x="16" y="104">失败时按数据流给出成因</text></g>
    <g transform="translate(610,80)"><rect width="250" height="130" rx="10" fill="#E8F1FB" stroke="#4A7FC1" stroke-width="1.6"/><text x="125" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">分析后 · 人裁决</text><text x="16" y="56">AI 提出竞争解释与区分分析</text><text x="16" y="80">人判断效应真伪与上线</text><text x="16" y="104">越好的结果越先回查可信度</text></g>
    <g transform="translate(250,300)"><rect width="400" height="150" rx="10" fill="#EAF6EE" stroke="#3E9B5F" stroke-width="1.8"/><text x="200" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1F5133">实验结论 = 带作用域的命题</text><text x="20" y="60">人群：分流单位、触发条件、平台与版本</text><text x="20" y="84">时间与口径：窗口、季节、指标定义版本</text><text x="20" y="108">效应：点估计 + 区间；可信度检查结果</text><text x="20" y="132">推翻条件：口径变更需复验、仅对某人群成立</text></g>
  </g>
  <g stroke="#6B7280" stroke-width="1.5" fill="none"><line x1="290" y1="145" x2="322" y2="145" marker-end="url(#g)"/><line x1="575" y1="145" x2="607" y2="145" marker-end="url(#g)"/><path d="M735,212 L735,375 L653,375" marker-end="url(#g)"/><path d="M248,375 L165,375 L165,214" marker-end="url(#g)"/></g>
  <text x="80" y="300" font-size="12.5" fill="#374151">召回：下一个</text><text x="80" y="318" font-size="12.5" fill="#374151">同类实验</text>
  <text x="755" y="300" font-size="12.5" fill="#374151">写入</text>
  <g font-size="12.5" fill="#7A2617"><rect x="250" y="470" width="400" height="56" rx="8" fill="#FCEDEA" stroke="#C0503A"/><text x="450" y="494" text-anchor="middle">指标口径变更 → 回溯旧口径上得出的结论，标注或复验</text><text x="450" y="514" text-anchor="middle">有人引用历史结论 → 连同作用域一起出现</text></g>
  <line x1="450" y1="450" x2="450" y2="468" stroke="#C0503A" stroke-width="1.5" marker-end="url(#g)"/>
</svg>
