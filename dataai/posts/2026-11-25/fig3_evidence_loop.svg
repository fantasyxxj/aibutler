<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A7FC1"/></marker>
  </defs>
  <rect width="900" height="560" fill="#FAFAF7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图3  核查的证据链：AI 起草、机器判定、人确认、写回命题</text>

  <!-- 图例 -->
  <g font-size="12" fill="#4B5563">
    <rect x="250" y="54" width="14" height="14" rx="3" fill="#E8F1FB" stroke="#4A7FC1"/><text x="270" y="66">AI 起草</text>
    <rect x="350" y="54" width="14" height="14" rx="3" fill="#E6F4EA" stroke="#3C8D5A"/><text x="370" y="66">机器可判定</text>
    <rect x="470" y="54" width="14" height="14" rx="3" fill="#FEF3E2" stroke="#E08A1E"/><text x="490" y="66">人确认</text>
    <rect x="566" y="54" width="14" height="14" rx="3" fill="#F3F4F6" stroke="#6B7280"/><text x="586" y="66">沉淀与召回</text>
  </g>

  <!-- 上排 -->
  <rect x="40" y="96" width="170" height="86" rx="10" fill="#F3F4F6" stroke="#6B7280"/>
  <text x="125" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">① 召回</text>
  <text x="125" y="142" text-anchor="middle" font-size="11.5" fill="#374151">口径要素、粒度与判重键</text>
  <text x="125" y="159" text-anchor="middle" font-size="11.5" fill="#374151">产出时刻、截止时刻</text>
  <text x="125" y="176" text-anchor="middle" font-size="11.5" fill="#374151">已有核查命题与类别</text>

  <rect x="250" y="96" width="170" height="86" rx="10" fill="#E8F1FB" stroke="#4A7FC1"/>
  <text x="335" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">② 推导规则与反例</text>
  <text x="335" y="142" text-anchor="middle" font-size="11.5" fill="#1E3A5F">四层检查各覆盖哪些键</text>
  <text x="335" y="159" text-anchor="middle" font-size="11.5" fill="#1E3A5F">应报的反例、不应报的正例</text>
  <text x="335" y="176" text-anchor="middle" font-size="11.5" fill="#1E3A5F">对 SQL 做变异</text>

  <rect x="460" y="96" width="170" height="86" rx="10" fill="#E6F4EA" stroke="#3C8D5A"/>
  <text x="545" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1B4D2E">③ 过滤器</text>
  <text x="545" y="142" text-anchor="middle" font-size="11.5" fill="#1B4D2E">能在执行通道上实际运行</text>
  <text x="545" y="159" text-anchor="middle" font-size="11.5" fill="#1B4D2E">反例报、正例不报</text>
  <text x="545" y="176" text-anchor="middle" font-size="11.5" fill="#1B4D2E">新增覆盖</text>

  <rect x="670" y="96" width="190" height="86" rx="10" fill="#FEF3E2" stroke="#E08A1E"/>
  <text x="765" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#7C4A03">④ 人确认规则</text>
  <text x="765" y="142" text-anchor="middle" font-size="11.5" fill="#7C4A03">作用域与阈值</text>
  <text x="765" y="159" text-anchor="middle" font-size="11.5" fill="#7C4A03">待确认 → 进入每日执行</text>

  <!-- 下排（右到左） -->
  <rect x="670" y="250" width="190" height="104" rx="10" fill="#E6F4EA" stroke="#3C8D5A"/>
  <text x="765" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#1B4D2E">⑤ 执行与覆盖证据</text>
  <text x="765" y="296" text-anchor="middle" font-size="11.5" fill="#1B4D2E">应比多少、实比多少、报错多少</text>
  <text x="765" y="313" text-anchor="middle" font-size="11.5" fill="#1B4D2E">两侧数据版本（快照号）</text>
  <text x="765" y="330" text-anchor="middle" font-size="11.5" fill="#9B1C1C">比较 0 项判红</text>
  <text x="765" y="347" text-anchor="middle" font-size="11.5" fill="#9B1C1C">报错不常态化</text>

  <rect x="460" y="250" width="170" height="104" rx="10" fill="#E6F4EA" stroke="#3C8D5A"/>
  <text x="545" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#1B4D2E">⑥ 差异逐类</text>
  <text x="545" y="296" text-anchor="middle" font-size="11.5" fill="#1B4D2E">判定条件按序归类</text>
  <text x="545" y="313" text-anchor="middle" font-size="11.5" fill="#1B4D2E">每类行数与金额净差</text>
  <text x="545" y="330" text-anchor="middle" font-size="11.5" fill="#1B4D2E">与类别基线比</text>
  <text x="545" y="347" text-anchor="middle" font-size="11.5" fill="#9B1C1C">未解释必须为 0</text>

  <rect x="250" y="250" width="170" height="104" rx="10" fill="#E8F1FB" stroke="#4A7FC1"/>
  <text x="335" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">⑦ 归因与起草</text>
  <text x="335" y="296" text-anchor="middle" font-size="11.5" fill="#1E3A5F">未解释行提候选新类</text>
  <text x="335" y="313" text-anchor="middle" font-size="11.5" fill="#1E3A5F">沿血缘逐跳定引入点</text>
  <text x="335" y="330" text-anchor="middle" font-size="11.5" fill="#1E3A5F">起草结论，附样例与版本</text>
  <text x="335" y="347" text-anchor="middle" font-size="11.5" fill="#1E3A5F">措辞为「最可能」</text>

  <rect x="40" y="250" width="170" height="104" rx="10" fill="#FEF3E2" stroke="#E08A1E"/>
  <text x="125" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#7C4A03">⑧ 人确认结论</text>
  <text x="125" y="296" text-anchor="middle" font-size="11.5" fill="#7C4A03">新类的名字与判定条件</text>
  <text x="125" y="313" text-anchor="middle" font-size="11.5" fill="#7C4A03">口径差还是缺陷</text>
  <text x="125" y="330" text-anchor="middle" font-size="11.5" fill="#7C4A03">基线量级</text>

  <!-- 箭头 上排 -->
  <g stroke="#6B7280" stroke-width="1.4" marker-end="url(#g)">
    <line x1="210" y1="139" x2="248" y2="139"/>
    <line x1="420" y1="139" x2="458" y2="139"/>
    <line x1="630" y1="139" x2="668" y2="139"/>
    <line x1="765" y1="182" x2="765" y2="248"/>
    <line x1="670" y1="302" x2="632" y2="302"/>
    <line x1="460" y1="302" x2="422" y2="302"/>
    <line x1="250" y1="302" x2="212" y2="302"/>
  </g>
  <!-- 过滤不通过回退 -->
  <path d="M545,182 C545,222 335,222 335,184" fill="none" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="440" y="236" text-anchor="middle" font-size="11" fill="#9B1C1C">不通过，退回重写</text>
  <!-- 无新类、无跳变 -->
  <path d="M545,354 L545,372 L765,372 L765,356" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="655" y="388" text-anchor="middle" font-size="11" fill="#4B5563">无新类、无跳变、实比 = 应比：照格式留档，不送人</text>

  <!-- 写回命题 -->
  <rect x="40" y="410" width="590" height="70" rx="10" fill="#F3F4F6" stroke="#6B7280"/>
  <text x="56" y="434" font-size="14" font-weight="600" fill="#1F2937">⑨ 写回可证伪命题，挂到表、指标与比对关系上</text>
  <text x="56" y="456" font-size="12" fill="#374151">「天表对订单源按应用逐键比：除『晚到』『零金额』两类外差异为零，『晚到』常态数十行」</text>
  <text x="56" y="473" font-size="12" fill="#374151">作用域 · 比较对象 · 判据 · 证据链接（版本、执行证据、类别分布、样例）</text>
  <line x1="125" y1="354" x2="125" y2="408" stroke="#6B7280" stroke-width="1.4" marker-end="url(#g)"/>

  <!-- 召回时刻 -->
  <rect x="670" y="410" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#4A7FC1"/>
  <text x="765" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">动手时召回</text>
  <text x="765" y="456" text-anchor="middle" font-size="12" fill="#1E3A5F">上线 · 回补 · 迁移</text>
  <text x="765" y="473" text-anchor="middle" font-size="11.5" fill="#4B5563">判断有基线</text>
  <line x1="630" y1="445" x2="668" y2="445" stroke="#4A7FC1" stroke-width="1.4" marker-end="url(#b)"/>
  <path d="M765,480 L765,500 L22,500 L22,139 L38,139" fill="none" stroke="#4A7FC1" stroke-width="1.3" marker-end="url(#b)"/>

  <text x="450" y="530" text-anchor="middle" font-size="13" fill="#4B5563">AI 产出必须过机器可判定的过滤器；规则是否生效、差异属于什么性质，由执行证据与人共同裁定。</text>
</svg>
