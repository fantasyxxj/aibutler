<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
  </defs>
  <rect width="900" height="560" fill="#FAFAF7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图1  事件时间与处理时间：「到齐」是约定，不是事实</text>

  <!-- 左：流 -->
  <rect x="24" y="60" width="430" height="424" rx="14" fill="#F7F9FC" stroke="#9DBBEB" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="44" y="86" font-size="15" font-weight="600" fill="#1F4E9E">流：水位线估计完整性，宽限把迟到显式化</text>

  <!-- 窗口带 -->
  <rect x="80" y="292" width="350" height="40" fill="#E8F0FC"/>
  <text x="84" y="288" font-size="11.5" fill="#1F4E9E">一个事件时间窗口</text>

  <!-- 轴 -->
  <g stroke="#6B7280" stroke-width="1.4" marker-end="url(#g)">
    <line x1="80" y1="440" x2="436" y2="440"/>
    <line x1="80" y1="440" x2="80" y2="104"/>
  </g>
  <text x="430" y="462" text-anchor="end" font-size="12" fill="#4B5563">处理时间（到达系统）→</text>
  <text x="88" y="114" font-size="12" fill="#4B5563">事件时间（实际发生）↑</text>

  <!-- 理想线 -->
  <line x1="80" y1="440" x2="410" y2="120" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="330" y="150" font-size="11.5" fill="#6B7280">理想：发生即到达</text>

  <!-- 水位线 -->
  <path d="M80,440 C150,425 200,370 250,345 S330,280 430,215" fill="none" stroke="#1F4E9E" stroke-width="2"/>
  <text x="352" y="238" font-size="12" font-weight="600" fill="#1F4E9E">水位线</text>

  <!-- 触发点与宽限 -->
  <line x1="282" y1="292" x2="282" y2="440" stroke="#1F4E9E" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="352" y1="292" x2="352" y2="440" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="282" y="408" width="70" height="22" fill="#FEF3E2"/>
  <text x="317" y="423" text-anchor="middle" font-size="11.5" fill="#92400E">宽限期</text>
  <text x="282" y="476" text-anchor="middle" font-size="11" fill="#1F4E9E">窗口首次触发</text>
  <text x="362" y="476" text-anchor="middle" font-size="11" fill="#92400E">状态清除</text>

  <!-- 事件点 -->
  <g fill="#3B6FC4">
    <circle cx="228" cy="322" r="4.5"/><circle cx="245" cy="305" r="4.5"/><circle cx="262" cy="318" r="4.5"/><circle cx="274" cy="300" r="4.5"/>
  </g>
  <circle cx="318" cy="315" r="5.5" fill="#E08A1E"/>
  <circle cx="400" cy="310" r="5.5" fill="#C0392B"/>
  <text x="318" y="355" text-anchor="middle" font-size="11" fill="#92400E">迟到·宽限内</text>
  <text x="318" y="369" text-anchor="middle" font-size="11" fill="#92400E">再次触发，修正结果</text>
  <text x="404" y="355" text-anchor="middle" font-size="11" fill="#9B1C1C">宽限外</text>
  <text x="404" y="369" text-anchor="middle" font-size="11" fill="#9B1C1C">丢弃或旁路</text>

  <!-- 右：批 -->
  <rect x="474" y="60" width="402" height="424" rx="14" fill="#FFFAF3" stroke="#E8B97A" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="494" y="86" font-size="15" font-weight="600" fill="#92400E">批：截止时刻把约定写进调度</text>

  <text x="494" y="122" font-size="12.5" fill="#1F2937">D 日事件按到达时刻落在三段：</text>
  <rect x="494" y="138" width="170" height="30" fill="#E8F0FC" stroke="#9DBBEB"/>
  <rect x="664" y="138" width="80" height="30" fill="#E6F4EA" stroke="#86C59B"/>
  <rect x="744" y="138" width="112" height="30" fill="#FDECEC" stroke="#E39A9A"/>
  <text x="579" y="158" text-anchor="middle" font-size="12" fill="#1F4E9E">D 日内到达</text>
  <text x="704" y="158" text-anchor="middle" font-size="12" fill="#1E6B34">次日截止前</text>
  <text x="800" y="158" text-anchor="middle" font-size="12" fill="#9B1C1C">截止后到达</text>
  <g font-size="11" fill="#4B5563" text-anchor="middle">
    <text x="494" y="186" text-anchor="start">D 00:00</text><text x="664" y="186">D+1 00:00</text><text x="744" y="186">截止时刻</text>
  </g>
  <line x1="744" y1="132" x2="744" y2="174" stroke="#B42318" stroke-width="2"/>

  <rect x="494" y="204" width="362" height="60" rx="8" fill="#FFFFFF" stroke="#86C59B"/>
  <text x="508" y="228" font-size="12.5" fill="#1F2937">截止时刻：整分区重算覆盖一次，此后封口</text>
  <text x="508" y="250" font-size="12" fill="#4B5563">之后的小时增量只抓上一整点，不回补前一天</text>

  <text x="494" y="292" font-size="12.5" fill="#1F2937">封口后到达的，三选一，写进口径：</text>
  <g font-size="12" text-anchor="middle">
    <rect x="494" y="304" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#E39A9A"/><text x="549" y="329" fill="#1F2937">丢弃</text>
    <rect x="620" y="304" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#E39A9A"/><text x="675" y="329" fill="#1F2937">计入到达日</text>
    <rect x="746" y="304" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#E39A9A"/><text x="801" y="329" fill="#1F2937">单独迟到区</text>
  </g>

  <rect x="494" y="366" width="362" height="98" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="508" y="390" font-size="13" font-weight="600" fill="#1F2937">口径要写全</text>
  <text x="508" y="413" font-size="12" fill="#1F2937">· D 日 = 事件时间属于 D，且在截止时刻前到达</text>
  <text x="508" y="434" font-size="12" fill="#1F2937">· 分区按事件时间还是到达时间切</text>
  <text x="508" y="455" font-size="12" fill="#1F2937">· 每天迟到比例记为过程元数据</text>

  <text x="450" y="520" text-anchor="middle" font-size="13" fill="#4B5563">完整性无法观测：等多久、晚到怎样修正、过期后去哪，三件事都要事先约定。</text>
</svg>
