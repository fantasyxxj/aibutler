<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="900" height="520" fill="#FAFAF7"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图2  一次高危动作的路径：每一步都在代理之外留下证据</text>
  <g font-size="14" text-anchor="middle">
    <rect x="30" y="90" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/><text x="90" y="117" fill="#1F2937" font-weight="600">意图</text><text x="90" y="136" font-size="11.5" fill="#4B5563">结构化工具调用</text>
    <rect x="190" y="90" width="120" height="60" rx="10" fill="#F3F7FE" stroke="#9DBBEB"/><text x="250" y="117" fill="#1F4E9E" font-weight="600">分类</text><text x="250" y="136" font-size="11.5" fill="#4B5563">事故？谁的活？哪一级</text>
    <rect x="350" y="90" width="120" height="60" rx="10" fill="#FDF0F0" stroke="#E39A9A"/><text x="410" y="117" fill="#9B1C1C" font-weight="600">硬拦截</text><text x="410" y="136" font-size="11.5" fill="#4B5563">模式命中即拒绝</text>
    <rect x="510" y="90" width="120" height="60" rx="10" fill="#FEF8EC" stroke="#E7BE6A"/><text x="570" y="117" fill="#8A5A00" font-weight="600">动作前召回</text><text x="570" y="136" font-size="11.5" fill="#4B5563">规范·手册·历史事故</text>
    <rect x="670" y="90" width="190" height="60" rx="10" fill="#F3F7FE" stroke="#9DBBEB"/><text x="765" y="117" fill="#1F4E9E" font-weight="600">预演</text><text x="765" y="136" font-size="11.5" fill="#4B5563">影响面 + 回退方式</text>
  </g>
  <g stroke="#6B7280" stroke-width="1.4" marker-end="url(#g)"><line x1="150" y1="120" x2="188" y2="120"/><line x1="310" y1="120" x2="348" y2="120"/><line x1="470" y1="120" x2="508" y2="120"/><line x1="630" y1="120" x2="668" y2="120"/></g>
  <line x1="410" y1="150" x2="410" y2="212" stroke="#C0392B" stroke-width="1.4" marker-end="url(#r)"/>
  <rect x="330" y="214" width="160" height="40" rx="8" fill="#FFFFFF" stroke="#E39A9A"/><text x="410" y="239" text-anchor="middle" font-size="12.5" fill="#9B1C1C">拒绝并告知原因</text>
  <path d="M765,150 L765,300" stroke="#6B7280" stroke-width="1.4" fill="none" marker-end="url(#g)"/>
  <g font-size="14" text-anchor="middle">
    <rect x="670" y="302" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/><text x="765" y="329" fill="#1F2937" font-weight="600">批准</text><text x="765" y="348" font-size="11.5" fill="#4B5563">人看预演结果；事故按预授权</text>
    <rect x="460" y="302" width="160" height="60" rx="10" fill="#F3F7FE" stroke="#9DBBEB"/><text x="540" y="329" fill="#1F4E9E" font-weight="600">执行</text><text x="540" y="348" font-size="11.5" fill="#4B5563">照抄实测命令</text>
    <rect x="250" y="302" width="160" height="60" rx="10" fill="#F0FAF3" stroke="#86C59B"/><text x="330" y="329" fill="#1E6B34" font-weight="600">回读</text><text x="330" y="348" font-size="11.5" fill="#4B5563">目标侧证据，不认返回码</text>
    <rect x="40" y="302" width="160" height="60" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/><text x="120" y="329" fill="#1F2937" font-weight="600">审计</text><text x="120" y="348" font-size="11.5" fill="#4B5563">谁·依据·做了什么·结果</text>
  </g>
  <g stroke="#6B7280" stroke-width="1.4" marker-end="url(#g)"><line x1="670" y1="332" x2="622" y2="332"/><line x1="460" y1="332" x2="412" y2="332"/><line x1="250" y1="332" x2="202" y2="332"/></g>
  <path d="M120,362 L120,430 L648,430 L648,172 L615,172 L615,153" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#g)"/>
  <rect x="215" y="414" width="250" height="32" rx="6" fill="#FAFAF7"/>
  <text x="340" y="435" text-anchor="middle" font-size="12.5" fill="#4B5563">出错或被纠正 → 当场沉淀为规则，下次召回</text>
  <text x="450" y="490" text-anchor="middle" font-size="12.5" fill="#6B7280">同一条规则只放一层：能写成模式的进硬拦截，能识别动作类型的进召回，少量必须在场的才常驻</text>
</svg>
