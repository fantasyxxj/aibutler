<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
  <rect width="900" height="560" fill="#FAFAF7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图1  四类规律：三类描述「正常」，异常是相对它们的偏离</text>
  <!-- 分布 -->
  <rect x="40" y="66" width="260" height="250" rx="10" fill="#E8F1FB" stroke="#4A7FC1" stroke-width="1.6"/>
  <text x="170" y="94" text-anchor="middle" font-size="16" font-weight="600" fill="#1E3A5F">分布</text>
  <g fill="#4A7FC1"><rect x="80" y="196" width="18" height="40"/><rect x="100" y="150" width="18" height="86"/><rect x="120" y="130" width="18" height="106"/><rect x="140" y="160" width="18" height="76"/><rect x="160" y="186" width="18" height="50"/><rect x="180" y="204" width="18" height="32"/><rect x="200" y="214" width="18" height="22"/><rect x="220" y="222" width="18" height="14"/><rect x="240" y="228" width="18" height="8"/></g>
  <line x1="70" y1="236" x2="270" y2="236" stroke="#6B7280"/>
  <g font-size="12.5" fill="#1F2937"><text x="60" y="262">量级 · 空值率 · 基数 · 取值集合</text><text x="60" y="282">长尾：用分位数，不用均值</text><text x="60" y="302">基线：P50 / P90 / P99 历史区间</text></g>
  <!-- 周期 -->
  <rect x="320" y="66" width="260" height="250" rx="10" fill="#EAF6EE" stroke="#3E9B5F" stroke-width="1.6"/>
  <text x="450" y="94" text-anchor="middle" font-size="16" font-weight="600" fill="#1F5133">周期</text>
  <path d="M345,200 C365,140 385,140 405,200 C425,260 445,140 465,150 C485,160 505,250 525,215 C540,190 550,170 560,180" fill="none" stroke="#3E9B5F" stroke-width="2.2"/>
  <line x1="340" y1="236" x2="565" y2="236" stroke="#6B7280"/>
  <g font-size="12.5" fill="#1F2937"><text x="340" y="262">日内 · 星期 · 月末 · 节假日</text><text x="340" y="282">分解为 趋势 + 季节 + 残差</text><text x="340" y="302">基线：同星期几、同小时的区间</text></g>
  <!-- 关联 -->
  <rect x="600" y="66" width="260" height="250" rx="10" fill="#F3EEFA" stroke="#7C5CB8" stroke-width="1.6"/>
  <text x="730" y="94" text-anchor="middle" font-size="16" font-weight="600" fill="#3F2C66">关联</text>
  <g fill="#7C5CB8"><circle cx="640" cy="215" r="4"/><circle cx="660" cy="200" r="4"/><circle cx="680" cy="196" r="4"/><circle cx="700" cy="178" r="4"/><circle cx="720" cy="170" r="4"/><circle cx="740" cy="158" r="4"/><circle cx="760" cy="150" r="4"/><circle cx="780" cy="134" r="4"/><circle cx="800" cy="128" r="4"/><circle cx="820" cy="118" r="4"/></g>
  <line x1="625" y1="236" x2="840" y2="236" stroke="#6B7280"/>
  <g font-size="12.5" fill="#1F2937"><text x="620" y="262">比例 · 份额 · 同向变化</text><text x="620" y="282">写明聚合层次；相关不是因果</text><text x="620" y="302">基线：比例区间、结构份额</text></g>
  <!-- 箭头 -->
  <line x1="170" y1="320" x2="400" y2="392" stroke="#6B7280" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="450" y1="320" x2="450" y2="388" stroke="#6B7280" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="730" y1="320" x2="500" y2="392" stroke="#6B7280" stroke-width="1.5" marker-end="url(#g)"/>
  <!-- 异常 -->
  <rect x="200" y="396" width="500" height="130" rx="10" fill="#FCEDEA" stroke="#C0503A" stroke-width="1.8"/>
  <text x="450" y="426" text-anchor="middle" font-size="16" font-weight="600" fill="#7A2617">异常 = 相对基线的偏离</text>
  <g font-size="13" fill="#1F2937" text-anchor="middle"><text x="450" y="454">分布落在分位区间外 · 去掉周期后的残差超出容差 · 比例跳出区间</text><text x="450" y="478">方法：控制图、季节分解 + 极端值检验、孤立森林……</text></g>
  <text x="450" y="506" text-anchor="middle" font-size="13" font-weight="600" fill="#9B1C1C">没有基线，就无所谓异常；每条基线都要写明作用域、容差、推翻条件</text>
</svg>
