<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FDB"/></marker>
  </defs>
  <rect width="900" height="580" fill="#FAFAF7"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图1  广义元数据：一个传统部分，三个扩展方向</text>

  <!-- 传统 -->
  <rect x="30" y="66" width="200" height="250" rx="10" fill="#F1F4F9" stroke="#C9D2E0"/>
  <text x="130" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#6B7280">传统元数据（静态）</text>
  <rect x="44" y="106" width="172" height="196" rx="8" fill="#FFFFFF" stroke="#C9D2E0"/>
  <text x="130" y="138" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2937">结构描述</text>
  <text x="130" y="162" text-anchor="middle" font-size="12" fill="#4B5563">数据长什么样</text>
  <g font-size="11.5" fill="#6B7280" text-anchor="middle">
    <text x="130" y="194">表 · 字段 · 类型</text>
    <text x="130" y="214">注释 · 业务术语</text>
    <text x="130" y="246">随结构变更</text>
    <text x="130" y="270">NISO 描述型</text>
    <text x="130" y="288">Kimball 技术 / 业务元数据</text>
  </g>

  <!-- 扩展 -->
  <rect x="250" y="66" width="620" height="250" rx="10" fill="#FFF6EE" stroke="#E8A46A"/>
  <text x="560" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#9A5A22">扩展部分（动态）</text>
  <g text-anchor="middle">
    <rect x="264" y="106" width="190" height="196" rx="8" fill="#FFFFFF" stroke="#E8A46A"/>
    <text x="359" y="138" font-size="16" font-weight="600" fill="#1F2937">过程</text>
    <text x="359" y="162" font-size="12" fill="#4B5563">这次运行发生了什么</text>
    <g font-size="11.5" fill="#6B7280">
      <text x="359" y="194">起止时间 · 行数</text>
      <text x="359" y="214">错误 · 重试 · 就绪状态</text>
      <text x="359" y="246">每次运行都变</text>
      <text x="359" y="270">Kimball 过程元数据</text>
      <text x="359" y="288">DMBOK 操作元数据</text>
    </g>

    <rect x="465" y="106" width="190" height="196" rx="8" fill="#FFFFFF" stroke="#E8A46A"/>
    <text x="560" y="138" font-size="16" font-weight="600" fill="#1F2937">血缘与数据流</text>
    <text x="560" y="162" font-size="12" fill="#4B5563">数据从哪来、到哪去</text>
    <g font-size="11.5" fill="#6B7280">
      <text x="560" y="194">表级 / 字段级依赖</text>
      <text x="560" y="214">设计时 vs 运行时</text>
      <text x="560" y="246">随代码与运行而变</text>
      <text x="560" y="270">DMBOK 血缘与影响分析</text>
      <text x="560" y="288">OpenLineage</text>
    </g>

    <rect x="666" y="106" width="190" height="196" rx="8" fill="#FFFFFF" stroke="#E8A46A"/>
    <text x="761" y="138" font-size="16" font-weight="600" fill="#1F2937">指标语义</text>
    <text x="761" y="162" font-size="12" fill="#4B5563">结果代表什么</text>
    <g font-size="11.5" fill="#6B7280">
      <text x="761" y="194">口径 · 粒度 · 可加性</text>
      <text x="761" y="214">实现位置 · 引用关系</text>
      <text x="761" y="246">随业务定义而变</text>
      <text x="761" y="270">Airbnb Minerva</text>
      <text x="761" y="288">dbt 语义层</text>
    </g>
  </g>
  <text x="761" y="330" text-anchor="middle" font-size="11" fill="#9A5A22">存的是定义，不是指标值</text>

  <!-- AI 闭环 -->
  <rect x="30" y="350" width="840" height="170" rx="10" fill="#EEF4FD" stroke="#9DBBEB"/>
  <text x="450" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#1F4E9E">AI 让扩展部分第一次可以持续维护</text>
  <g text-anchor="middle">
    <rect x="70" y="394" width="200" height="84" rx="8" fill="#FFFFFF" stroke="#9DBBEB"/>
    <text x="170" y="422" font-size="15" font-weight="600" fill="#1F2937">采集</text>
    <text x="170" y="446" font-size="11.5" fill="#6B7280">读代码与数据，起草描述、</text>
    <text x="170" y="464" font-size="11.5" fill="#6B7280">字段级血缘、口径初稿</text>

    <rect x="350" y="394" width="200" height="84" rx="8" fill="#FFFFFF" stroke="#9DBBEB"/>
    <text x="450" y="422" font-size="15" font-weight="600" fill="#1F2937">校验</text>
    <text x="450" y="446" font-size="11.5" fill="#6B7280">持续比对「按设计」与「实际」：</text>
    <text x="450" y="464" font-size="11.5" fill="#6B7280">血缘、定义与实现、说明与分布</text>

    <rect x="630" y="394" width="200" height="84" rx="8" fill="#FFFFFF" stroke="#9DBBEB"/>
    <text x="730" y="422" font-size="15" font-weight="600" fill="#1F2937">使用</text>
    <text x="730" y="446" font-size="11.5" fill="#6B7280">元数据成为 AI 开发、排查、</text>
    <text x="730" y="464" font-size="11.5" fill="#6B7280">问答时的上下文</text>
  </g>
  <g stroke="#2F6FDB" stroke-width="1.6" fill="none" marker-end="url(#g)">
    <line x1="272" y1="442" x2="346" y2="442"/>
    <line x1="552" y1="442" x2="626" y2="442"/>
    <path d="M730,478 L730,494 L170,494 L170,482"/>
  </g>
  <text x="450" y="512" text-anchor="middle" font-size="11" fill="#1F4E9E">元数据越准 → AI 越可靠 → 维护成本越低</text>

  <rect x="30" y="532" width="840" height="36" rx="8" fill="#EEF0F3"/>
  <text x="450" y="555" text-anchor="middle" font-size="13" fill="#4B5563">定义类由人拍板、AI 起草；事实类由机器采集、人抽检</text>
</svg>
