<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E9E"/></marker>
  </defs>
  <rect width="900" height="560" fill="#FAFAF7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图1  时间触发与就绪触发：判定依据从时钟换成完成证据</text>

  <!-- 左：时间触发 -->
  <rect x="24" y="60" width="414" height="400" rx="14" fill="#FFFAF3" stroke="#E8B97A" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="231" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#92400E">① 时间触发：到点就跑</text>
  <text x="231" y="112" text-anchor="middle" font-size="12.5" fill="#4B5563">隐含假设：到点时上游已经就绪</text>

  <!-- 时间轴 -->
  <line x1="56" y1="176" x2="410" y2="176" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#g)"/>
  <text x="414" y="196" font-size="11.5" fill="#6B7280" text-anchor="end">时间</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="70" y="140" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#E8B97A"/><text x="136" y="159" fill="#1F2937">上游运行（晚到）</text>
    <line x1="210" y1="128" x2="210" y2="220" stroke="#B42318" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="210" y="236" fill="#B42318">定时到点</text>
    <rect x="214" y="188" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="289" y="207" fill="#1F2937">下游启动</text>
  </g>
  <rect x="70" y="258" width="322" height="58" rx="8" fill="#FEF2F2" stroke="#E5A3A3"/>
  <text x="231" y="282" text-anchor="middle" font-size="13" fill="#B42318">读到半截分区 → 结果偏小</text>
  <text x="231" y="304" text-anchor="middle" font-size="13" fill="#B42318">返回码 0、监控绿色、数是错的</text>
  <text x="231" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">问题</text>
  <text x="231" y="380" text-anchor="middle" font-size="12.5" fill="#1F2937">「上游晚到」被悄悄转换成</text>
  <text x="231" y="402" text-anchor="middle" font-size="12.5" fill="#1F2937">更难发现的「下游不完整」</text>

  <!-- 右：就绪触发 -->
  <rect x="462" y="60" width="414" height="400" rx="14" fill="#F7F9FC" stroke="#9DBBEB" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="669" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#1F4E9E">② 就绪触发：到点 + 证据齐备</text>
  <text x="669" y="112" text-anchor="middle" font-size="12.5" fill="#4B5563">按「数据时刻 × 运行槽位」查上游完成标记</text>

  <g font-size="13" text-anchor="middle">
    <rect x="494" y="134" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/><text x="569" y="159" fill="#1F2937">到点：最早可开始</text>
    <rect x="694" y="134" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#9DBBEB"/><text x="769" y="159" fill="#1F4E9E">上游标记（提交后写）</text>
    <polygon points="669,196 739,226 669,256 599,226" fill="#F3F7FE" stroke="#1F4E9E" stroke-width="1.3"/>
    <text x="669" y="231" fill="#1F4E9E" font-weight="600">都满足？</text>
  </g>
  <g stroke="#6B7280" stroke-width="1.4" fill="none" marker-end="url(#g)">
    <path d="M569,174 L640,210"/><path d="M769,174 L698,210"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <line x1="639" y1="244" x2="560" y2="292" stroke="#1E6B34" stroke-width="1.4" marker-end="url(#g)"/>
    <text x="580" y="262" fill="#1E6B34">是</text>
    <rect x="486" y="294" width="148" height="40" rx="8" fill="#F0FAF3" stroke="#86C59B"/><text x="560" y="319" fill="#1E6B34">下游运行</text>
    <line x1="699" y1="244" x2="778" y2="292" stroke="#92400E" stroke-width="1.4" marker-end="url(#g)"/>
    <text x="760" y="262" fill="#92400E">否</text>
    <rect x="704" y="294" width="148" height="40" rx="8" fill="#FFFFFF" stroke="#E8B97A"/><text x="778" y="319" fill="#92400E">按间隔再检查</text>
    <line x1="778" y1="334" x2="778" y2="364" stroke="#6B7280" stroke-width="1.4" marker-end="url(#g)"/>
    <text x="820" y="354" fill="#6B7280" font-size="11.5">超上限</text>
    <rect x="690" y="368" width="176" height="40" rx="8" fill="#FEF2F2" stroke="#E5A3A3"/><text x="778" y="393" fill="#B42318">记「上游缺失」→ 待人工</text>
  </g>
  <text x="560" y="372" text-anchor="middle" font-size="12" fill="#4B5563">失败或被跳过的上游</text>
  <text x="560" y="392" text-anchor="middle" font-size="12" fill="#4B5563">不算「已更新」</text>

  <text x="450" y="500" text-anchor="middle" font-size="13" fill="#4B5563">时间给出最早开始时刻，就绪给出必要条件；等不到上游记为上游缺失，不记为下游失败。</text>
</svg>
