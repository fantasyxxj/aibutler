<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FDB"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
  </defs>
  <rect width="900" height="580" fill="#FAFAF7"/>
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图2  口径的沉淀与召回：AI 起草，人裁决</text>

  <!-- 上：沉淀 -->
  <rect x="30" y="64" width="840" height="190" rx="10" fill="#FFF8F1" stroke="#E8A46A" stroke-width="1.5"/>
  <text x="50" y="92" font-size="16" font-weight="600" fill="#9A5A22">沉淀：从存量 SQL 到口径命题</text>

  <rect x="50" y="116" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#E8A46A" stroke-width="1.6"/>
  <text x="125" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">存量 SQL</text>
  <text x="125" y="164" text-anchor="middle" font-size="12" fill="#4B5563">报表 · 加工 · 临时查询</text>
  <line x1="204" y1="148" x2="244" y2="148" stroke="#C2410C" stroke-width="2" marker-end="url(#o)"/>

  <rect x="250" y="116" width="170" height="64" rx="8" fill="#FFFFFF" stroke="#E8A46A" stroke-width="1.6"/>
  <text x="335" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">AI 抽取要素</text>
  <text x="335" y="164" text-anchor="middle" font-size="12" fill="#4B5563">聚合 · 去重键 · 窗口 · 过滤</text>
  <line x1="424" y1="148" x2="464" y2="148" stroke="#C2410C" stroke-width="2" marker-end="url(#o)"/>

  <rect x="470" y="116" width="170" height="64" rx="8" fill="#FFFFFF" stroke="#E8A46A" stroke-width="1.6"/>
  <text x="555" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">按要素比对</text>
  <text x="555" y="164" text-anchor="middle" font-size="12" fill="#4B5563">同名不同义 · 同义不同名</text>
  <line x1="644" y1="148" x2="684" y2="148" stroke="#C2410C" stroke-width="2" marker-end="url(#o)"/>

  <rect x="690" y="116" width="160" height="64" rx="8" fill="#FDECDD" stroke="#C2410C" stroke-width="1.8"/>
  <text x="770" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#7C2D12">负责人裁决</text>
  <text x="770" y="164" text-anchor="middle" font-size="12" fill="#7C2D12">补作用域 · 版本化 · 定标准</text>

  <text x="450" y="214" text-anchor="middle" font-size="12" fill="#9A5A22">AI 产出标「待确认」；裁决结果当场写成命题，挂到指标、表、字段上</text>
  <line x1="770" y1="184" x2="770" y2="282" stroke="#C2410C" stroke-width="2" marker-end="url(#o)"/>

  <!-- 中：命题图 -->
  <rect x="560" y="286" width="290" height="70" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/>
  <text x="705" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">指标定义 + 口径命题</text>
  <text x="705" y="338" text-anchor="middle" font-size="12" fill="#4B5563">版本 · 生效时间 · 取代关系 · 禁忌</text>

  <!-- 下：召回 -->
  <rect x="30" y="380" width="840" height="176" rx="10" fill="#F3F7FE" stroke="#9DBBEB" stroke-width="1.5"/>
  <text x="50" y="408" font-size="16" font-weight="600" fill="#1F4E9E">召回：取数或改 SQL 时</text>

  <rect x="50" y="430" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#9DBBEB" stroke-width="1.6"/>
  <text x="120" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">问题 / 改动</text>
  <text x="120" y="478" text-anchor="middle" font-size="12" fill="#4B5563">涉及哪些指标、表</text>
  <line x1="194" y1="462" x2="230" y2="462" stroke="#2F6FDB" stroke-width="2" marker-end="url(#b)"/>

  <rect x="236" y="430" width="150" height="64" rx="8" fill="#EEF4FD" stroke="#2F6FDB" stroke-width="1.6"/>
  <text x="311" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">召回定义与命题</text>
  <text x="311" y="478" text-anchor="middle" font-size="12" fill="#4B5563">沿推导与血缘扩散</text>
  <line x1="392" y1="462" x2="428" y2="462" stroke="#2F6FDB" stroke-width="2" marker-end="url(#b)"/>
  <path d="M640,360 C560,400 360,400 330,426" fill="none" stroke="#2F6FDB" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#b)"/>

  <rect x="434" y="430" width="140" height="64" rx="8" fill="#FFFFFF" stroke="#9DBBEB" stroke-width="1.6"/>
  <text x="504" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">生成 SQL</text>
  <text x="504" y="478" text-anchor="middle" font-size="12" fill="#4B5563">优先经语义层</text>
  <line x1="578" y1="462" x2="614" y2="462" stroke="#2F6FDB" stroke-width="2" marker-end="url(#b)"/>

  <rect x="620" y="430" width="230" height="64" rx="8" fill="#EEF4FD" stroke="#2F6FDB" stroke-width="1.6"/>
  <text x="735" y="457" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">按要素反向校验</text>
  <text x="735" y="478" text-anchor="middle" font-size="12" fill="#4B5563">去重键、窗口、过滤是否与定义一致</text>

  <text x="450" y="530" text-anchor="middle" font-size="12" fill="#1F4E9E">一致：返回结果并注明引用的定义版本　·　不一致：退回重写　·　未命中定义：明说是非标准口径</text>
</svg>
