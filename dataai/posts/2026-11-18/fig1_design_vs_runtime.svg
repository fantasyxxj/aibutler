<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
  </defs>
  <rect width="900" height="560" fill="#FAFAF7"/>
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1F2937">图1  设计时血缘与运行时血缘的比对</text>

  <!-- 来源 -->
  <rect x="40" y="66" width="250" height="78" rx="10" fill="#F3F7FE" stroke="#9DBBEB" stroke-width="1.5"/>
  <text x="165" y="94" text-anchor="middle" font-size="16" font-weight="600" fill="#1F4E9E">设计时：解析代码</text>
  <text x="165" y="116" text-anchor="middle" font-size="12" fill="#4B5563">看见全部代码路径与意图</text>
  <text x="165" y="134" text-anchor="middle" font-size="12" fill="#4B5563">看不见动态 SQL、非 SQL 加工、跨引擎</text>

  <rect x="610" y="66" width="250" height="78" rx="10" fill="#FEF6EC" stroke="#E8B97A" stroke-width="1.5"/>
  <text x="735" y="94" text-anchor="middle" font-size="16" font-weight="600" fill="#9A5B13">运行时：引擎采集</text>
  <text x="735" y="116" text-anchor="middle" font-size="12" fill="#4B5563">看见实际执行的表与字段</text>
  <text x="735" y="134" text-anchor="middle" font-size="12" fill="#4B5563">看不见没跑到的、没接入的</text>

  <!-- 两个集合 -->
  <circle cx="345" cy="320" r="150" fill="#9DBBEB" fill-opacity="0.28" stroke="#5B8BD6" stroke-width="1.6"/>
  <circle cx="555" cy="320" r="150" fill="#E8B97A" fill-opacity="0.28" stroke="#D08A2E" stroke-width="1.6"/>
  <line x1="165" y1="146" x2="270" y2="196" stroke="#6B7280" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="735" y1="146" x2="630" y2="196" stroke="#6B7280" stroke-width="1.5" marker-end="url(#g)"/>

  <text x="275" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">设计有、运行无</text>
  <text x="275" y="324" text-anchor="middle" font-size="12" fill="#374151">死代码 · 未触发分支</text>
  <text x="275" y="342" text-anchor="middle" font-size="12" fill="#374151">低频作业 · 观测窗口太短</text>
  <text x="275" y="366" text-anchor="middle" font-size="12" fill="#6B7280">→ 按最长调度周期再判</text>

  <text x="450" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">一致</text>
  <text x="450" y="314" text-anchor="middle" font-size="12" fill="#374151">已确认的边</text>
  <line x1="410" y1="334" x2="490" y2="334" stroke="#9CA3AF" stroke-dasharray="3 3"/>
  <text x="450" y="356" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">字段不同</text>
  <text x="450" y="374" text-anchor="middle" font-size="12" fill="#374151">SELECT * · 漂移</text>
  <text x="450" y="392" text-anchor="middle" font-size="12" fill="#6B7280">→ 以运行为准</text>

  <text x="625" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#B42318">运行有、设计无</text>
  <text x="625" y="324" text-anchor="middle" font-size="12" fill="#374151">手工操作 · 临时脚本</text>
  <text x="625" y="342" text-anchor="middle" font-size="12" fill="#374151">未登记作业 · 动态 SQL</text>
  <text x="625" y="366" text-anchor="middle" font-size="12" fill="#B42318">→ 最需处理：送裁决</text>

  <!-- AI 层 -->
  <rect x="120" y="492" width="660" height="48" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="1.4"/>
  <text x="450" y="514" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">AI：补读解析器读不懂的代码（标待确认，被运行印证才升级）</text>
  <text x="450" y="532" text-anchor="middle" font-size="12" fill="#4B5563">结合提交、调度、发布、审计记录解释差异，起草处理，人确认后沉淀为命题</text>
</svg>
